  - id: "GoogleCN"
    name: "GoogleCN"
    tags: ["Google","CN","CDN"]
    sources:
      - url: "https://raw.githubusercontent.com/felixonmars/dnsmasq-china-list/refs/heads/master/google.china.conf"
      - geosite: "v2fly/google@cn"
    preprocess: |-
      function process(content) {
        return content.split(/\r?\n/).map(function(line) {
          var match = line.match(/^server=\/([^/]+)\/114\.114\.114\.114$/);
          return match ? "DOMAIN-SUFFIX," + match[1] : line;
        }).join("\n");
      }
    merge:
      strategy: union
    outputs: ["mihomo", "Shadowrocket", "sing-box", "surge"]

