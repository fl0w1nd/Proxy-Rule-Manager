      - file: "claude.list"
    merge:
      strategy: union
    outputs: ["mihomo", "Shadowrocket", "sing-box", "surge"]

  - id: "gemini"
    name: "Gemini"
    tags: ["Google","AI"]
    sources:
      - url: "https://raw.githubusercontent.com/v2fly/domain-list-community/8fc2fa9b9dd9ab943839b6273008f085ecceccad/data/google-deepmind"
    preprocess: |-
      function process(content) {
        return content.split(/\r?\n/).map(function(line) {
          if (/^full:(.+)$/.test(line)) {
            return line.replace(/^full:(.+)$/, "DOMAIN,$1");
          }
          if (/^(?![#\s]|DOMAIN)(.+\..+)$/.test(line)) {
            return "DOMAIN-SUFFIX," + line;
          }
          return line;
        }).join("\n");
      }
    outputs: ["mihomo", "Shadowrocket", "sing-box", "surge"]

