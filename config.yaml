geosite:
  providers:
    - name: v2fly
      clients: ["mihomo", "Shadowrocket", "sing-box", "surge"]

update:
  history_retention: 168h
  history_limit: 200
  schedule:
    mode: manual
  fetch:
    timeout: 20s
    max_download: 50MB
    concurrency: 8
    per_host_concurrency: 2
    retries: 2
    retry_delay: 500ms
    user_agent: Proxy-Rule-Manager/2.0
  preprocess:
    timeout: 5s
    max_output: 8MB
