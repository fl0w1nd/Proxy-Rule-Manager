<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<script>
(function () {
  try {
    var stored = localStorage.getItem('prm-theme');
    if (stored === 'light' || stored === 'dark') {
      document.documentElement.setAttribute('data-theme', stored);
    }
  } catch (e) {}
})();
</script>
<title>PRM · 管理看板</title>
<link rel="icon" href="static/icons/prm.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@400;700&family=Space+Grotesk:wght@300;400;500;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root, [data-theme="dark"] {
  --bg: #000000;
  --surface: #0E0E0E;
  --surface-2: #161616;
  --border: #1F1F1F;
  --border-vis: #333333;
  --text: #E8E8E8;
  --display: #FFFFFF;
  --sec: #999999;
  --dim: #666666;
  --red: #F04438;
  --orange: #FF6B1A;
  --blue: #4A8DFF;
  --green: #55B06C;
  --dot-op: 0.35;
  --backdrop: rgba(0, 0, 0, 0.72);
}
[data-theme="light"] {
  --bg: #F7F5F0;
  --surface: #FFFFFF;
  --surface-2: #F0EEE8;
  --border: #E8E5DE;
  --border-vis: #CFCCC3;
  --text: #1A1A1A;
  --display: #000000;
  --sec: #666666;
  --dim: #9B988F;
  --red: #D71921;
  --orange: #FA5D0F;
  --blue: #2E6BE6;
  --green: #3E8E4F;
  --dot-op: 0.5;
  --backdrop: rgba(30, 28, 24, 0.45);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
.theme-switching *, .theme-switching *::before, .theme-switching *::after {
  transition: none !important;
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: "Space Grotesk", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.55;
  transition: background 200ms cubic-bezier(0.25,0.1,0.25,1), color 200ms cubic-bezier(0.25,0.1,0.25,1);
}
.wrap { max-width: 1160px; margin: 0 auto; padding: 0 28px; }
svg.px { display: block; image-rendering: pixelated; }
::selection { background: var(--orange); color: #000; }
button { font-family: inherit; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 0 18px;
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 14px; }
.brand-name {
  font-family: "Space Mono", monospace;
  font-size: 13px; font-weight: 700; letter-spacing: 0.14em;
  color: var(--display);
}
.brand-sub { font-size: 11px; color: var(--dim); margin-top: 3px; }
.top-meta { display: flex; align-items: center; gap: 18px; }
.btn-bracket {
  background: none; border: none; cursor: pointer;
  font-family: "Space Mono", monospace;
  font-size: 12px;
  color: var(--sec); padding: 6px 2px;
  text-decoration: none;
  transition: color 150ms;
}
.btn-bracket:hover { color: var(--display); }

.facts {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 12px;
  padding: 32px 0 8px;
}
.fact {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 18px;
}
.fact .k { font-size: 11px; color: var(--dim); letter-spacing: 0.05em; margin-bottom: 8px; }
.fact .v {
  font-family: "Space Mono", monospace;
  font-size: 15px; color: var(--display);
}
/* update action */
.update-actions {
  display: flex; align-items: center;
  margin-top: 14px;
}
.pill-btn {
  background: transparent; border: 1px solid var(--border-vis); border-radius: 999px;
  color: var(--text); font-family: "Space Mono", monospace; font-size: 11px;
  letter-spacing: 0.05em;
  padding: 7px 16px; cursor: pointer; text-decoration: none;
  transition: all 150ms;
  white-space: nowrap;
}
.pill-btn:hover { color: var(--display); border-color: var(--display); }
.pill-btn.primary { background: var(--display); color: var(--bg); border-color: var(--display); }
.pill-btn.primary:hover { opacity: 0.85; }
.pill-btn.danger { color: var(--red); border-color: var(--red); }
.pill-btn.mini { padding: 4px 12px; font-size: 10px; }
.pill-btn[disabled], .pill-btn.disabled { opacity: 0.4; pointer-events: none; }

.tabs {
  display: inline-flex;
  border: 1px solid var(--border-vis);
  border-radius: 999px;
  padding: 3px;
  gap: 2px;
  margin: 28px 0 20px;
}
.tab-btn {
  background: transparent; border: none; cursor: pointer;
  font-size: 12px;
  color: var(--sec);
  padding: 7px 18px; border-radius: 999px;
  transition: all 150ms;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.on { background: var(--display); color: var(--bg); }
.tab-btn .n { font-family: "Space Mono", monospace; font-size: 10px; margin-left: 5px; opacity: 0.7; }
.tab-panel { display: none; }
.tab-panel.on { display: block; }

.table-scroll {
  width: 100%;
  overflow-x: auto;
  scrollbar-color: var(--border-vis) var(--bg);
  scrollbar-width: thin;
}
.table-scroll:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
.data-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  table-layout: fixed;
}
.data-table th, .data-table td {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  text-align: left;
  vertical-align: middle;
}
.data-table thead th {
  position: sticky; top: 0; z-index: 5;
  background: var(--bg);
  border-bottom-color: var(--border-vis);
  font-size: 11px; color: var(--dim);
  font-weight: 400;
}
.data-table .num {
  text-align: right;
  font-family: "Space Mono", monospace;
  font-variant-numeric: tabular-nums;
}
.admin-rule-table { min-width: 760px; }
.admin-rule-table .col-name { width: 30%; }
.admin-rule-table .col-entries { width: 8%; }
.admin-rule-table .col-version { width: 18%; }
.admin-rule-table .col-check { width: 32%; }
.admin-rule-table .col-action { width: 12%; }
.arow { font-size: 13px; }
.arow .aname { color: var(--display); font-weight: 500; }
.aversion { font-family: "Space Mono", monospace; font-size: 11px; color: var(--sec); font-variant-numeric: tabular-nums; white-space: nowrap; }
.astatus { font-size: 12px; white-space: nowrap; }
.astatus.updated { color: var(--green); }
.astatus.unchanged { color: var(--sec); }
.astatus.failed { color: var(--red); }
.astatus.cancelled { color: var(--orange); }
.astatus.none { color: var(--dim); }
.astatus.updating { color: var(--blue); }
.aop { text-align: right; }

.crow { border-bottom: 1px solid var(--border); }
.crow > summary {
  list-style: none; cursor: pointer;
  display: grid;
  grid-template-columns: minmax(160px, 1.5fr) 140px;
  gap: 12px; align-items: center;
  padding: 12px 16px;
  transition: background 120ms;
}
.crow > summary::-webkit-details-marker { display: none; }
.crow > summary:hover { background: var(--surface); }
.cname { color: var(--display); font-weight: 500; font-size: 13px; }
.cdiff { font-family: "Space Mono", monospace; font-size: 11px; text-align: right; }
.cdiff .add { color: var(--green); }
.cdiff .del { color: var(--orange); }
.csamples { padding: 0 16px 16px; }
.csamples .grp { margin-bottom: 10px; }
.csamples .gk { font-size: 11px; color: var(--dim); margin-bottom: 6px; }
.csamples pre {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
  font-family: "Space Mono", monospace;
  font-size: 11px; line-height: 1.6;
  color: var(--sec);
  overflow-x: auto;
  max-height: 260px; overflow-y: auto;
  white-space: pre;
}
.csamples pre .add { color: var(--green); }
.csamples pre .del { color: var(--orange); }

#updatesBody { width: 100%; min-width: 920px; }
.update-list-head,
.update-run > summary {
  display: grid;
  grid-template-columns: 12px minmax(210px, 1.35fr) 120px minmax(130px, 1fr) 100px 100px 80px;
  align-items: center; gap: 12px;
}
.update-list-head {
  min-height: 36px; padding: 7px 12px;
  border-bottom: 1px dashed var(--border-vis);
  color: var(--dim); font-size: 10px;
}
.update-list-head > span:nth-last-child(-n+3) { text-align: right; }
.update-run {
  border-bottom: 1px dashed var(--border);
}
.update-run > summary {
  list-style: none; cursor: pointer;
  min-height: 44px; padding: 8px 12px;
  transition: background 80ms steps(2, end), box-shadow 80ms steps(2, end);
}
.update-run > summary::-webkit-details-marker { display: none; }
.update-run > summary:hover { background: var(--surface); box-shadow: inset 3px 0 0 var(--orange); }
.update-run[open] > summary { border-bottom: 1px dashed var(--border-vis); }
.update-toggle {
  color: var(--dim); font-size: 16px; line-height: 1;
  transform-origin: center; transition: transform 80ms steps(2, end), color 80ms steps(2, end);
}
.update-run[open] .update-toggle { color: var(--orange); transform: rotate(90deg); }
.update-run-title { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.update-run-time { color: var(--display); font-size: 11.5px; font-weight: 700; white-space: nowrap; }
.update-run-origin { color: var(--sec); font-size: 10px; white-space: nowrap; }
.update-status {
  color: var(--sec); font-size: 10.5px; white-space: nowrap;
}
.update-status.completed { color: var(--green); }
.update-status.running, .update-status.cancelling { color: var(--blue); }
.update-status.completed_with_warnings, .update-status.cancelled { color: var(--orange); }
.update-status.completed_with_errors, .update-status.interrupted { color: var(--red); }
.update-cell { color: var(--sec); font-size: 10.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.update-number { text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }
.update-detail { padding: 10px 14px 12px 36px; background: color-mix(in srgb, var(--surface) 72%, transparent); }
.update-rules-title { color: var(--sec); font-size: 10px; }
.update-rule-list { display: flex; flex-wrap: wrap; gap: 5px; padding: 7px 0 2px; }
.update-rule-id {
  padding: 2px 6px; border: 1px solid var(--border);
  color: var(--sec); background: var(--bg); font-size: 9.5px;
}
.update-messages { display: grid; gap: 6px; margin-top: 9px; }
.update-message {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px;
  padding: 7px 9px; border-left: 2px solid var(--border-vis);
  background: var(--bg); color: var(--sec); font-size: 10px;
}
.update-message-label { color: var(--dim); white-space: nowrap; }
.update-message.warning { border-left-color: var(--orange); }
.update-message.warning .update-message-label { color: var(--orange); }
.update-message.issue, .update-message.failure { border-left-color: var(--red); }
.update-message.issue .update-message-label, .update-message.failure .update-message-label { color: var(--red); }
.empty { padding: 40px 0; text-align: center; color: var(--dim); font-size: 13px; }

/* update stream */
.update-modal-bk {
  position: fixed; inset: 0; z-index: 100;
  display: none; align-items: center; justify-content: center;
  padding: 24px; background: var(--backdrop);
}
.update-modal-bk.show { display: flex; }
.update-modal {
  width: min(760px, 100%); max-height: min(760px, 92vh);
  display: flex; flex-direction: column;
  background: var(--bg); border: 2px solid var(--border-vis);
  clip-path: var(--pixel-cut); filter: drop-shadow(7px 7px 0 var(--shadow));
}
.update-modal-head {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 20px;
  padding: 18px 20px 14px; border-bottom: 1px dashed var(--border-vis);
}
.update-modal-title { color: var(--display); font-family: "Doto", "Space Mono", monospace; font-size: 18px; font-weight: 700; letter-spacing: .06em; }
.update-modal-sub { color: var(--sec); font-size: 11px; margin-top: 4px; }
.update-close { width: 32px; height: 32px; padding: 0; flex: 0 0 auto; }
.update-overview { padding: 16px 20px; border-bottom: 1px dashed var(--border-vis); }
.update-current { color: var(--display); font-size: 12px; min-height: 20px; }
.update-progress { height: 8px; margin-top: 12px; border: 1px solid var(--border-vis); background: var(--surface); }
.update-progress > span { display: block; height: 100%; width: 0; background: var(--orange); transition: width 120ms steps(4, end); }
.update-counts { color: var(--dim); font-size: 10px; margin-top: 7px; }
.update-events {
  min-height: 220px; max-height: 430px; overflow-y: auto;
  padding: 8px 0; scrollbar-color: var(--border-vis) var(--bg);
}
.update-event {
  display: grid; grid-template-columns: 72px 14px minmax(0, 1fr); gap: 8px;
  padding: 6px 20px; color: var(--sec); font-size: 11px; line-height: 1.45;
}
.update-event .et { color: var(--dim); font-variant-numeric: tabular-nums; }
.update-event .ed { color: var(--blue); }
.update-event.success .ed, .update-event.success .em { color: var(--green); }
.update-event.warning .ed, .update-event.warning .em { color: var(--orange); }
.update-event.error .ed, .update-event.error .em { color: var(--red); }
.update-event .em { min-width: 0; overflow-wrap: anywhere; }
.update-modal-foot {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 20px; border-top: 1px dashed var(--border-vis);
}
.update-foot-actions { display: flex; gap: 10px; margin-left: auto; }

/* geosite provider table */
.geosite-table { min-width: 920px; }
.geosite-table .col-provider { width: 18%; }
.geosite-table .col-status { width: 18%; }
.geosite-table .col-version { width: 18%; }
.geosite-table .col-lists { width: 8%; }
.geosite-table .col-variants { width: 10%; }
.geosite-table .col-entries { width: 14%; }
.geosite-table .col-files { width: 14%; }
.grow { font-size: 12px; }
.gname { font-family: "Space Mono", monospace; color: var(--display); }
.gver { font-family: "Space Mono", monospace; font-size: 11px; color: var(--sec); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gnum { text-align: right; font-family: "Space Mono", monospace; font-size: 11.5px; color: var(--text); font-variant-numeric: tabular-nums; }

@media (max-width: 900px) {
  .data-table thead th:first-child { left: 0; z-index: 7; }
  .data-table tbody th[scope="row"] {
    position: sticky; left: 0; z-index: 2;
    background: var(--bg);
    box-shadow: 1px 0 0 var(--border);
  }
  .arow:hover > th[scope="row"], .grow:hover > th[scope="row"] {
    background: var(--surface);
    box-shadow: inset 3px 0 0 var(--orange), 1px 0 0 var(--border);
  }
}

/* pixel interface */
:root, [data-theme="dark"] {
  --bg: #11100d;
  --surface: #181713;
  --surface-2: #22201a;
  --border: #302e28;
  --border-vis: #777168;
  --text: #d8d3c9;
  --display: #fffaf0;
  --sec: #a49d91;
  --dim: #6f6a62;
  --orange: #ff6418;
  --shadow: #000000;
  --grain: rgba(255, 250, 240, 0.045);
  --pixel-cut: polygon(4px 0, calc(100% - 4px) 0, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px), 0 4px);
}
[data-theme="light"] {
  --bg: #f3efe6;
  --surface: #fffdf6;
  --surface-2: #e9e3d8;
  --border: #d7d0c4;
  --border-vis: #978f83;
  --text: #2d2a27;
  --display: #151412;
  --sec: #686159;
  --dim: #999186;
  --orange: #f45b16;
  --shadow: #b8b0a4;
  --grain: rgba(66, 56, 45, 0.065);
}
html { scrollbar-color: var(--border-vis) var(--bg); }
body {
  min-height: 100vh;
  background-color: var(--bg);
  background-image:
    radial-gradient(circle at 1px 1px, var(--grain) 0.7px, transparent 0.8px),
    linear-gradient(transparent 95%, var(--grain) 100%);
  background-size: 5px 5px, 100% 4px;
  font-family: "Space Mono", "PingFang SC", "Microsoft YaHei", monospace;
  letter-spacing: 0.01em;
  transition-timing-function: steps(3, end);
}
.wrap { max-width: 1480px; padding: 0 36px 44px; }
.topbar { padding: 22px 8px 18px; border-bottom: 1px dashed var(--border-vis); }
.brand { gap: 16px; }
.brand-name {
  font-family: "Doto", "Space Mono", monospace;
  font-size: 17px;
  letter-spacing: 0.12em;
  text-shadow: 1px 0 0 currentColor;
}
.brand-sub { font-family: "Space Mono", monospace; font-size: 12px; }
.btn-bracket { color: var(--text); transition: color 80ms steps(2, end), transform 80ms steps(2, end); }
.btn-bracket:hover { color: var(--orange); transform: translateY(-1px); }
.btn-bracket:active { transform: translate(1px, 1px); }
.facts { gap: 20px; padding-top: 36px; }
.fact {
  min-height: 104px;
  padding: 18px 22px;
  border: 2px solid var(--border-vis);
  border-radius: 0;
  clip-path: var(--pixel-cut);
  filter: drop-shadow(3px 3px 0 var(--shadow));
}
.fact .k { font-size: 12px; color: var(--sec); }
.fact .v { font-size: 18px; font-weight: 700; }
.pill-btn {
  border-radius: 0;
  background: var(--surface);
  box-shadow: 2px 2px 0 var(--shadow);
  transition: color 80ms steps(2, end), border-color 80ms steps(2, end), background 80ms steps(2, end), transform 80ms steps(2, end), box-shadow 80ms steps(2, end);
}
.pill-btn:hover {
  color: var(--display);
  border-color: var(--orange);
  transform: translate(-1px, -1px);
  box-shadow: 3px 3px 0 var(--shadow);
}
.pill-btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--shadow); }
.pill-btn.primary { box-shadow: 3px 3px 0 var(--orange); }
.pill-btn.primary:hover { opacity: 1; background: var(--orange); border-color: var(--orange); }
.tabs {
  border-radius: 0;
  clip-path: var(--pixel-cut);
  filter: drop-shadow(3px 3px 0 var(--shadow));
  background: var(--surface);
  padding: 4px;
  gap: 0;
}
.tab-btn {
  border-radius: 0;
  font-family: "Space Mono", monospace;
  transition: color 80ms steps(2, end), background 80ms steps(2, end), transform 80ms steps(2, end);
}
.tab-btn.on { box-shadow: inset 0 0 0 1px var(--bg); }
.tab-btn:active { transform: translate(1px, 1px); }
.data-table thead th { background: var(--bg); border-bottom-style: dashed; border-bottom-color: var(--border-vis); }
.data-table tbody th, .data-table tbody td, .crow { border-bottom-style: dashed; }
.arow > *, .grow > * { transition: background 80ms steps(2, end), box-shadow 80ms steps(2, end); }
.arow:hover > *, .grow:hover > * { background: var(--surface); }
.arow:hover > :first-child, .grow:hover > :first-child { box-shadow: inset 3px 0 0 var(--orange); }
.arow .aname, .cname, .gname { font-family: "Space Mono", monospace; font-weight: 700; }
.astatus.updating { animation: pixel-signal 700ms steps(2, end) infinite; }
.crow > summary { transition: background 80ms steps(2, end), box-shadow 80ms steps(2, end); }
.crow > summary:hover { box-shadow: inset 3px 0 0 var(--orange); }
.crow[open] > summary { background: var(--surface); border-bottom: 1px dashed var(--border-vis); }
.csamples { border-left: 3px solid var(--orange); background: color-mix(in srgb, var(--surface) 72%, transparent); padding-top: 14px; }
.csamples pre {
  border-radius: 0;
  border-color: var(--border-vis);
  background-color: #0b0c09;
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 19px, rgba(255,255,255,0.025) 19px, rgba(255,255,255,0.025) 20px);
  line-height: 20px;
  box-shadow: 3px 3px 0 var(--shadow);
}
button:focus-visible, a:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; }

@keyframes pixel-signal { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.35; } }

@media (max-width: 700px) {
  .wrap { padding: 0 16px 32px; }
  .topbar { align-items: flex-start; }
  .top-meta { gap: 8px; }
  .brand-name { font-size: 13px; }
  .facts { grid-template-columns: 1fr; gap: 14px; }
  .tabs { display: grid; grid-template-columns: repeat(2, 1fr); width: 100%; }
  .update-message { grid-template-columns: 1fr; gap: 2px; }
  .update-modal-bk { padding: 0; }
  .update-modal { width: 100%; max-height: 100vh; min-height: 100vh; border-left: 0; border-right: 0; clip-path: none; filter: none; }
  .update-events { max-height: none; flex: 1; }
  .update-event { grid-template-columns: 58px 12px minmax(0, 1fr); padding-left: 14px; padding-right: 14px; }
}
@media (max-width: 900px) {
  .arow:hover > th[scope="row"], .grow:hover > th[scope="row"] {
    box-shadow: inset 3px 0 0 var(--orange), 1px 0 0 var(--border);
  }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
</style>
</head>
