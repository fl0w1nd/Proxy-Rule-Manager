<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Proxy Rule Manager</title>
<script>
(function () {
  try {
    var stored = localStorage.getItem('prm-theme');
    if (stored === 'light' || stored === 'dark') {
      document.documentElement.setAttribute('data-theme', stored);
    }
  } catch (e) {}
})();
</script>
<link rel="icon" href="static/icons/prm.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@600;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="static/assets/public.css?v={{assetver}}">
</head>
<body>
<div id="public-app"></div>
<script id="prm-data" type="application/json">{{publicdata .}}</script>
<script type="module" src="static/assets/public.js?v={{assetver}}"></script>
</body>
</html>
