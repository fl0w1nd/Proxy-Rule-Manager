<!doctype html>
<html lang="zh-CN" data-theme="dark" data-overlayscrollbars-initialize>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Proxy Rule Manager</title>
<script>
(function () {
  try {
    var stored = localStorage.getItem('prm-theme');
    if (stored === 'light' || stored === 'dark') {
      document.documentElement.setAttribute('data-theme', stored);
    }
  } catch (e) {}
})();
</script>
<link rel="icon" href="static/icons/prm.svg" type="image/svg+xml">
<style>
@font-face{font-family:"Zpix";src:url("static/assets/zpix.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"VT323";src:url("static/assets/VT323-Regular.ttf") format("truetype");font-weight:400;font-style:normal;font-display:swap}
</style>
<link rel="stylesheet" href="static/assets/public.css?v={{assetver}}">
</head>
<body data-overlayscrollbars-initialize>
<div id="public-app"></div>
<script id="prm-data" type="application/json">{{publicdata .}}</script>
<script type="module" src="static/assets/public.js?v={{assetver}}"></script>
</body>
</html>
