version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - frontend
    versioning-strategy: increase-if-necessary

  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - backend

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - infra
    # Pin base images to versions verified by CI to avoid breaking changes
    # like Node.js 25+ removing corepack from default distribution.
    # Bump majors manually after confirming Dockerfile/CI compatibility.
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
      - dependency-name: golang
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
