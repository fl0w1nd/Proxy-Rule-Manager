name: Publish Rules to GitHub Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    if: ${{ vars.PRM_PAGES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out user configuration
        uses: actions/checkout@v6
        with:
          ref: publish
          path: user

      - name: Download latest PRM release
        id: prm
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          source_repo="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.source.full_name // .full_name')"
          tag="$(gh api "repos/$source_repo/releases/latest" --jq .tag_name)"
          release_dir="$RUNNER_TEMP/prm-release"
          mkdir -p "$release_dir"

          gh release download "$tag" \
            --repo "$source_repo" \
            --pattern 'prm_*_linux_amd64.tar.gz' \
            --pattern checksums.txt \
            --dir "$release_dir"

          cd "$release_dir"
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf prm_*_linux_amd64.tar.gz
          chmod +x "$release_dir/prm"
          "$release_dir/prm" --version
          echo "path=$release_dir/prm" >> "$GITHUB_OUTPUT"

      - name: Restore rule workspace
        uses: actions/cache@v6
        with:
          path: |
            user/data/.state
            user/data/geosite
            user/data/rules
          key: ${{ runner.os }}-prm-data-${{ github.repository_id }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-prm-data-${{ github.repository_id }}-

      - name: Load secret environment
        shell: bash
        env:
          PRM_ENV: ${{ secrets.PRM_ENV }}
        run: |
          while IFS= read -r entry || [[ -n "$entry" ]]; do
            [[ -z "$entry" || "$entry" == \#* ]] && continue
            name="${entry%%=*}"
            if [[ "$entry" != *=* || ! "$name" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
              echo "PRM_ENV contains an invalid environment entry" >&2
              exit 1
            fi
            printf '%s\n' "$entry" >> "$GITHUB_ENV"
          done <<< "$PRM_ENV"

      - name: Build static site
        working-directory: user
        run: ${{ steps.prm.outputs.path }} --config config.yaml --data-dir data build --output dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: user/dist

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
