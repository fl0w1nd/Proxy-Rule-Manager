name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (default: version from package.json)'
        required: false
        default: ''
      tag_type:
        description: 'Tag type'
        required: false
        default: 'release'
        type: choice
        options:
          - 'release'   # version + latest
          - 'dev'       # dev + git hash
          - 'isolated'  # tag only, no overwrite

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      tags: ${{ steps.tags.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get package.json version
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=v${VERSION}" >> $GITHUB_OUTPUT
          echo "Package version: v${VERSION}"

      - name: Get git short hash
        id: git
        run: |
          HASH=$(git rev-parse --short HEAD)
          echo "hash=${HASH}" >> $GITHUB_OUTPUT
          echo "Git hash: ${HASH}"

      - name: Vars (lowercased image)
        id: vars
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "Image: ${IMAGE}"

      - name: Determine tags
        id: tags
        run: |
          IMAGE="${{ steps.vars.outputs.image }}"
          TAG="${{ github.event.inputs.tag }}"
          TAG_TYPE="${{ github.event.inputs.tag_type }}"
          PKG_VERSION="${{ steps.pkg.outputs.version }}"
          GIT_HASH="${{ steps.git.outputs.hash }}"

          case "$TAG_TYPE" in
            "release")
              VERSION="${TAG:-$PKG_VERSION}"
              TAGS="${IMAGE}:${VERSION}
          ${IMAGE}:latest"
              echo "Build type: Release"
              echo "Tags: ${VERSION}, latest"
              ;;
            "dev")
              TAGS="${IMAGE}:dev
          ${IMAGE}:${GIT_HASH}"
              echo "Build type: Dev"
              echo "Tags: dev, ${GIT_HASH}"
              ;;
            "isolated")
              if [ -z "$TAG" ]; then
                echo "Error: Tag is required for isolated builds"
                exit 1
              fi
              TAGS="${IMAGE}:${TAG}"
              echo "Build type: Isolated"
              echo "Tags: ${TAG}"
              ;;
          esac

          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "$TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Check if release version exists
        if: github.event.inputs.tag_type == 'release'
        run: |
          IMAGE="${{ steps.vars.outputs.image }}"

          VERSION="${{ github.event.inputs.tag }}"
          if [ -z "$VERSION" ]; then
            VERSION="${{ steps.pkg.outputs.version }}"
          fi

          echo "Checking if ${VERSION} exists..."

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://ghcr.io/v2/${IMAGE#ghcr.io/}/manifests/${VERSION}" 2>/dev/null || echo "000")

          if [ "$STATUS" = "200" ]; then
            echo "::error::Version ${VERSION} already exists! Please bump version in package.json."
            exit 1
          fi

          echo "✓ Version ${VERSION} is available"

      - name: Check if isolated tag exists
        if: github.event.inputs.tag_type == 'isolated'
        run: |
          IMAGE="${{ steps.vars.outputs.image }}"
          TAG="${{ github.event.inputs.tag }}"

          # Block version-like tags and 'latest'
          if echo "$TAG" | grep -qE "^v[0-9]|^latest$"; then
            echo "::error::Cannot use version tags (v*) or 'latest' as isolated tag"
            exit 1
          fi

          echo "Checking if ${TAG} exists..."

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://ghcr.io/v2/${IMAGE#ghcr.io/}/manifests/${TAG}" 2>/dev/null || echo "000")

          if [ "$STATUS" = "200" ]; then
            echo "::error::Tag '${TAG}' already exists!"
            exit 1
          fi

          echo "✓ Tag ${TAG} is available"

  build:
    needs: prepare
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 单平台并行 build + push（按 digest 推送，不抢 tag）
      - name: Build and push (by digest)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true

          # 关键：推 digest（name-canonical 便于后面引用）
          outputs: |
            type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true

          # cache 分 arch scope，命中更稳
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

          # 不需要就关掉，省时间
          provenance: false
          sbom: false

      # 导出 digest 到本地目录
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
          echo "Exported digest: $digest"

      # 上传 digest（明确指定名称避免冲突）
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  manifest:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Set up Docker Buildx (for imagetools)
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Create and push multi-arch manifests for all tags
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          # 列出所有下载的 digest 文件
          ls -la /tmp/digests/
          
          # 从文件名读取 digests（文件名就是 digest 去掉 sha256: 前缀）
          digests=()
          for digest_file in /tmp/digests/*; do
            digest="sha256:$(basename "$digest_file")"
            digests+=("${IMAGE}@${digest}")
            echo "Found digest: $digest"
          done
          
          echo ""
          echo "Tags to publish:"
          echo "${TAGS}"
          echo ""

          # 为每个 tag 创建 multi-arch manifest
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Publishing manifest: ${tag}"
            docker buildx imagetools create \
              -t "${tag}" \
              "${digests[@]}"
          done <<< "${TAGS}"
