name: Build and Push Docker Image

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag'
        required: false
        default: 'dev'
      tag_type:
        description: 'Tag type: dev, release (v* + latest), isolated (tag only)'
        required: false
        default: 'dev'
        type: choice
        options:
          - 'dev'
          - 'release'
          - 'isolated'
  
  # Auto trigger on release
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          TAGS=""
          
          # GitHub Release event
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}"
            # Only add latest if version starts with 'v'
            if [[ "$VERSION" == v* ]]; then
              TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
              echo "Build type: GitHub Release (with latest)"
            else
              echo "Build type: GitHub Release (isolated)"
            fi
            echo "Tags: ${TAGS}"
          
          # Manual trigger
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            TAG_TYPE="${{ github.event.inputs.tag_type }}"
            
            case "$TAG_TYPE" in
              "release")
                # Release: tag + latest
                TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"
                TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
                echo "Build type: Release"
                echo "Tags: ${TAG}, latest"
                ;;
              "isolated")
                # Isolated: tag only
                TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"
                echo "Build type: Isolated"
                echo "Tags: ${TAG}"
                ;;
              *)
                # Dev: dev tag only
                TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev"
                echo "Build type: Dev"
                echo "Tags: dev"
                ;;
            esac
          fi
          
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/bake-action@v5
        with:
          files: ./docker-bake.hcl
          targets: app
          push: true
          set: |
            app.tags=${{ steps.tags.outputs.tags }}
          provenance: false
