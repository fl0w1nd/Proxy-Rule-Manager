name: Build and Push Docker Image

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (default: version from package.json)'
        required: false
        default: ''
      tag_type:
        description: 'Tag type'
        required: false
        default: 'release'
        type: choice
        options:
          - 'release'   # version + latest
          - 'dev'       # dev + git hash
          - 'isolated'  # tag only, no overwrite
  
  # Auto trigger on release
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get package.json version
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=v${VERSION}" >> $GITHUB_OUTPUT
          echo "Package version: v${VERSION}"

      - name: Get git short hash
        id: git
        run: |
          HASH=$(git rev-parse --short HEAD)
          echo "hash=${HASH}" >> $GITHUB_OUTPUT
          echo "Git hash: ${HASH}"

      - name: Determine tags
        id: tags
        run: |
          TAGS=""
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          # Convert to lowercase (ghcr requires lowercase)
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          
          # GitHub Release event
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            TAGS="${IMAGE}:${VERSION},${IMAGE}:latest"
            echo "Build type: GitHub Release"
            echo "Tags: ${VERSION}, latest"
          
          # Manual trigger
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            TAG_TYPE="${{ github.event.inputs.tag_type }}"
            PKG_VERSION="${{ steps.pkg.outputs.version }}"
            GIT_HASH="${{ steps.git.outputs.hash }}"
            
            case "$TAG_TYPE" in
              "release")
                # Use provided tag or package.json version
                VERSION="${TAG:-$PKG_VERSION}"
                TAGS="${IMAGE}:${VERSION},${IMAGE}:latest"
                echo "Build type: Release"
                echo "Tags: ${VERSION}, latest"
                ;;
              "dev")
                # Dev: dev + git hash
                TAGS="${IMAGE}:dev,${IMAGE}:${GIT_HASH}"
                echo "Build type: Dev"
                echo "Tags: dev, ${GIT_HASH}"
                ;;
              "isolated")
                # Isolated: single tag only
                if [ -z "$TAG" ]; then
                  echo "Error: Tag is required for isolated builds"
                  exit 1
                fi
                TAGS="${IMAGE}:${TAG}"
                echo "Build type: Isolated"
                echo "Tags: ${TAG}"
                ;;
            esac
          fi
          
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Check if release version exists
        if: github.event.inputs.tag_type == 'release' || github.event_name == 'release'
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${{ github.event.inputs.tag }}"
            if [ -z "$VERSION" ]; then
              VERSION="${{ steps.pkg.outputs.version }}"
            fi
          fi
          
          echo "Checking if ${VERSION} exists..."
          
          # Try to get manifest
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://ghcr.io/v2/${IMAGE#ghcr.io/}/manifests/${VERSION}" 2>/dev/null || echo "000")
          
          if [ "$STATUS" = "200" ]; then
            echo "::error::Version ${VERSION} already exists! Please bump version in package.json."
            exit 1
          fi
          
          echo "✓ Version ${VERSION} is available"

      - name: Check if isolated tag exists
        if: github.event.inputs.tag_type == 'isolated'
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          TAG="${{ github.event.inputs.tag }}"
          
          # Block version-like tags and 'latest'
          if echo "$TAG" | grep -qE "^v[0-9]|^latest$"; then
            echo "::error::Cannot use version tags (v*) or 'latest' as isolated tag"
            exit 1
          fi
          
          echo "Checking if ${TAG} exists..."
          
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://ghcr.io/v2/${IMAGE#ghcr.io/}/manifests/${TAG}" 2>/dev/null || echo "000")
          
          if [ "$STATUS" = "200" ]; then
            echo "::error::Tag '${TAG}' already exists!"
            exit 1
          fi
          
          echo "✓ Tag ${TAG} is available"

      - name: Build and push
        uses: docker/bake-action@v5
        with:
          files: ./docker-bake.hcl
          targets: app
          push: true
          set: |
            app.tags=${{ steps.tags.outputs.tags }}
          provenance: false
