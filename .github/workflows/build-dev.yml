name: Build Dev Docker Image

on:
  workflow_dispatch:
    inputs:
      extra_tag:
        description: Optional extra tag for this dev build
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: build-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  prepare:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.vars.outputs.image }}
      version: ${{ steps.version.outputs.version }}
      tags: ${{ steps.tags.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get git short hash
        id: git
        run: |
          HASH=$(git rev-parse --short HEAD)
          echo "hash=${HASH}" >> "$GITHUB_OUTPUT"
          echo "Git hash: ${HASH}"

      - name: Resolve dev version
        id: version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          HASH="${{ steps.git.outputs.hash }}"
          VERSION="${PKG_VERSION}-dev.${HASH}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Dev version: ${VERSION}"

      - name: Vars (lowercased image)
        id: vars
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Image: ${IMAGE}"

      - name: Validate extra tag
        if: github.event.inputs.extra_tag != ''
        run: |
          EXTRA_TAG="${{ github.event.inputs.extra_tag }}"

          if echo "$EXTRA_TAG" | grep -qE '^v[0-9]|^latest$'; then
            echo "::error::Extra dev tag cannot use release tag names"
            exit 1
          fi

      - name: Prepare dev tags
        id: tags
        run: |
          IMAGE="${{ steps.vars.outputs.image }}"
          HASH="${{ steps.git.outputs.hash }}"
          EXTRA_TAG="${{ github.event.inputs.extra_tag }}"
          TAGS=$(printf '%s\n%s\n' "${IMAGE}:dev" "${IMAGE}:${HASH}")

          if [ -n "$EXTRA_TAG" ]; then
            TAGS=$(printf '%s\n%s\n' "$TAGS" "${IMAGE}:${EXTRA_TAG}")
          fi

          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$TAGS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
          outputs: |
            type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=dev-${{ matrix.arch }}
          cache-to: type=gha,scope=dev-${{ matrix.arch }},mode=max
          provenance: false
          sbom: false

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
          echo "Exported digest: $digest"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  manifest:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Create and push multi-arch manifests
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          digests=()

          for digest_file in /tmp/digests/*; do
            digest="sha256:$(basename "$digest_file")"
            digests+=("${IMAGE}@${digest}")
            echo "Found digest: $digest"
          done

          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Publishing manifest: ${tag}"
            docker buildx imagetools create \
              -t "${tag}" \
              "${digests[@]}"
          done <<< "${TAGS}"
