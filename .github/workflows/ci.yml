name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.4.2 or 0.5.0-dev.1)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# CI triggers are split by source: feature branches run via `pull_request`,
# main runs via branch `push`, and releases run via tag `push` or
# manual `workflow_dispatch` with a version input. PR runs cancel stale
# commits within the same PR; main and release runs keep their full history.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend-lint:
    name: Frontend / Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm exec eslint . --max-warnings=0

  frontend-typecheck:
    name: Frontend / Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: tsc --noEmit
        run: pnpm run typecheck

  frontend-build:
    name: Frontend / Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: next build
        run: pnpm run build

  backend-lint:
    name: Backend / Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2026.1
      - name: staticcheck
        run: staticcheck ./...

  backend-test:
    name: Backend / Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum
      - name: go test -race
        run: go test -race ./...

  backend-build:
    name: Backend / Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum
      - name: go build
        run: go build -trimpath -ldflags="-s -w" -o /tmp/proxy-rule-manager ./cmd/server

  release-meta:
    name: Publish / Resolve metadata
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    needs:
      - frontend-lint
      - frontend-typecheck
      - frontend-build
      - backend-lint
      - backend-test
      - backend-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
      channel_tag: ${{ steps.meta.outputs.channel_tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      target_sha: ${{ steps.meta.outputs.target_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve release metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          TARGET_SHA=$(git rev-parse HEAD)

          if echo "$VERSION" | grep -Eq '^[0-9]+[.][0-9]+[.][0-9]+$'; then
            CHANNEL_TAG="latest"
            PRERELEASE=false
          elif echo "$VERSION" | grep -Eiq '^[0-9]+[.][0-9]+[.][0-9]+-dev([.-][0-9A-Za-z]+)*$'; then
            CHANNEL_TAG="dev"
            PRERELEASE=true
          else
            echo "::error::version must be x.y.z or x.y.z-dev[.suffix], got: ${VERSION}"
            exit 1
          fi

          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "image=${IMAGE}"
            echo "channel_tag=${CHANNEL_TAG}"
            echo "prerelease=${PRERELEASE}"
            echo "target_sha=${TARGET_SHA}"
          } >> "$GITHUB_OUTPUT"

  build-image:
    name: Publish / Build ${{ matrix.platform }}
    needs: release-meta
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Stamp package.json version for image build
        env:
          VERSION: ${{ needs.release-meta.outputs.version }}
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.env.VERSION;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');"
          echo "Stamped package.json version: $(jq -r '.version' package.json)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ needs.release-meta.outputs.version }}
          outputs: type=image,name=${{ needs.release-meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          provenance: false
          sbom: false

      # Matrix jobs cannot reliably share `outputs:` (the last instance wins),
      # so persist each per-arch digest as an artifact and merge them in the
      # downstream publish job via `buildx imagetools create`.
      - name: Export digest to file
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          echo -n "$DIGEST" > "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish / Image manifest and Release
    needs:
      - release-meta
      - build-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download digest artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: image-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ needs.release-meta.outputs.image }}
          TAG: ${{ needs.release-meta.outputs.tag }}
          CHANNEL_TAG: ${{ needs.release-meta.outputs.channel_tag }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:${CHANNEL_TAG}" \
            $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:${TAG}"

      # Drop the local tag (if fetched via tag-push) so git-cliff treats HEAD
      # as unreleased and groups commits under the upcoming TAG uniformly for
      # both tag-push and workflow_dispatch events.
      - name: Prepare git-cliff range
        env:
          TAG: ${{ needs.release-meta.outputs.tag }}
        run: git tag -d "$TAG" 2>/dev/null || true

      - name: Generate release notes
        id: notes
        uses: orhun/git-cliff-action@v4
        with:
          config: .git-cliff.toml
          args: --tag ${{ needs.release-meta.outputs.tag }} --unreleased --strip header
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Note: for workflow_dispatch the tag is created by the Releases API
      # below (via target_commitish), not by `git push`. This avoids triggering
      # a second CI run from a tag push event. Releases are published as
      # drafts so you can review/polish the auto-generated notes before going
      # live; flip the toggle in the GitHub UI to publish.
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-meta.outputs.tag }}
          target_commitish: ${{ needs.release-meta.outputs.target_sha }}
          name: ${{ needs.release-meta.outputs.tag }}
          body: ${{ steps.notes.outputs.content }}
          draft: true
          prerelease: ${{ needs.release-meta.outputs.prerelease == 'true' }}
