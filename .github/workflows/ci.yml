name: CI

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - ".github/workflows/**"
      - "docs/**"
      - "README.md"
      - ".vscode/**"
      - ".gitignore"
      - ".dockerignore"
      - ".goreleaser.yaml"
      - ".golangci.yml"
      - "config.template.yaml"
  pull_request:
    paths-ignore:
      - ".github/workflows/**"
      - "docs/**"
      - "README.md"
      - ".vscode/**"
      - ".gitignore"
      - ".dockerignore"
      - ".goreleaser.yaml"
      - ".golangci.yml"
      - "config.template.yaml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install pnpm
        run: npm install -g pnpm@10.33.0

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Build web assets
        run: make build-web

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: ./...

  test:
    name: Unit tests and race detector
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install pnpm
        run: npm install -g pnpm@10.33.0

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Build web assets
        run: make build-web

      - name: Run tests
        run: go test -race -shuffle=on -covermode=atomic -coverprofile=coverage.out ./...

      - name: Report coverage
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage.out
          path: coverage.out
          archive: false
          retention-days: 7

  build:
    name: Binary validation
    needs:
      - lint
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install pnpm
        run: npm install -g pnpm@10.33.0

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Check web types
        run: pnpm check
        working-directory: web

      - name: Run web component tests
        run: pnpm test --run
        working-directory: web

      - name: Build binary
        run: make build

      - name: Verify binary version
        shell: bash
        run: |
          expected="$(tr -d '[:space:]' < version/VERSION)"
          actual="$(./bin/prm --version)"
          test "$actual" = "prm version $expected"

  container:
    name: Container validation
    needs:
      - lint
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read build metadata
        id: metadata
        shell: bash
        run: |
          {
            echo "version=$(tr -d '[:space:]' < version/VERSION)"
            echo "commit=$(git rev-parse --short=12 HEAD)"
            echo "date=$(git show -s --format=%cI HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: prm:ci
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            COMMIT=${{ steps.metadata.outputs.commit }}
            BUILD_DATE=${{ steps.metadata.outputs.date }}
          cache-from: type=gha,scope=ci-container
          cache-to: type=gha,mode=max,scope=ci-container

      - name: Verify container version
        run: docker run --rm prm:ci --version | grep -Fx "prm version ${{ steps.metadata.outputs.version }}"
