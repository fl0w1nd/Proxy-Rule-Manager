name: CI

on:
  push:
    branches:
      - "**"
    paths-ignore: &ci-skip-paths
      # Docs and files this workflow does not validate. Keep ci.yml,
      # Dockerfile, .dockerignore, and .golangci.yml out of this list.
      - "*.md"
      - "**/*.md"
      - "docs/**"
      - "config.template.yaml"
      - ".gitignore"
      - ".goreleaser.yaml"
      - ".github/workflows/droid.yml"
      - ".github/workflows/droid-review.yml"
      - ".github/workflows/pages.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths-ignore: *ci-skip-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up toolchain
        uses: ./.github/actions/setup-tools
        with:
          go-cache: "false"
          pnpm-cache: "true"

      - name: Build web assets
        run: mise run build:web

      - name: Upload web assets
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: |
            internal/admin/dist
            internal/site/dist
          if-no-files-found: error
          retention-days: 1

  web-test:
    name: Web checks and component tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up toolchain
        uses: ./.github/actions/setup-tools
        with:
          go-cache: "false"
          pnpm-cache: "true"

      - name: Check web types and run component tests
        run: mise run test:web

  lint:
    name: Lint
    needs: web
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up toolchain
        uses: ./.github/actions/setup-tools

      - name: Download web assets
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: internal

      - name: Check pinned tool versions
        run: mise run check:versions

      - name: Check formatting
        run: mise run lint:fmt

      - name: Run go vet
        run: mise run --skip-deps lint:vet

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          install-mode: none
          args: ./...

  test:
    name: Unit tests and race detector
    needs: web
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up toolchain
        uses: ./.github/actions/setup-tools

      - name: Download web assets
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: internal

      - name: Run tests
        run: mise run --skip-deps test:race

      - name: Report coverage
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage.out
          path: coverage.out
          archive: false
          retention-days: 7

  build:
    name: Binary validation
    needs:
      - lint
      - test
      - web-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up toolchain
        uses: ./.github/actions/setup-tools

      - name: Download web assets
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: internal

      - name: Build binary
        run: mise run --skip-deps build

      - name: Verify binary version
        shell: bash
        run: |
          expected="$(tr -d '[:space:]' < version/VERSION)"
          actual="$(./bin/prm --version)"
          test "$actual" = "prm version $expected"
  container:
    name: Container validation
    needs:
      - lint
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read build metadata
        id: metadata
        shell: bash
        run: |
          {
            echo "version=$(tr -d '[:space:]' < version/VERSION)"
            echo "commit=$(git rev-parse --short=12 HEAD)"
            echo "date=$(git show -s --format=%cI HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: prm:ci
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            COMMIT=${{ steps.metadata.outputs.commit }}
            BUILD_DATE=${{ steps.metadata.outputs.date }}
          cache-from: type=gha,scope=ci-container
          cache-to: type=gha,mode=max,scope=ci-container

      - name: Smoke-test container
        run: docker run --rm prm:ci --version
