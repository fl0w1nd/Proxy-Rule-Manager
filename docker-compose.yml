services:
  proxy-rule-manager:
    build: .
    container_name: proxy-rule-manager
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Persist data directory (SQLite db + rule artifacts)
      - ./data:/app/data
    environment:
      - PORT=3000
      # Admin token (leave empty to disable authentication)
      - ADMIN_TOKEN=your-secure-token-here
      # Data directories (Dockerfile defaults; listed here for visibility)
      - DATA_DIR=/app/data
      - OUT_DIR=/app/out
    healthcheck:
      test: ["CMD", "/app/proxy-rule-manager", "--healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
