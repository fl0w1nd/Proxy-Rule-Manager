# ============================================================
# Proxy Rule Manager 配置模板与字段参考
# ============================================================
#
# 使用方法：
#   cp config.template.yaml config.yaml
#   prm validate -c config.yaml
#   prm update
#
# 语法约定：
#   · 时长（Duration）：采用 Go 标准时长格式，如 500ms、15s、30m、168h
#   · 体积（Size）：支持带单位字符串（如 "50MB"）或纯数字字节数
#   · 运行时参数（数据目录、HTTP 监听地址等）：通过 CLI 参数或 PRM_* 环境变量指定
#
# 完整配置说明见 docs/configuration.md。
# ============================================================

# ============================================================
# clients —— 目标代理客户端与输出格式
# ============================================================
# 支持三种输出定义方式：
#   · 多格式（formats）：同一客户端输出多种格式（如 Mihomo 的 Classical 与 YAML）
#   · 单格式（template）：直接在客户端层级指定单一模板
#   · 派生变体（variants）：在规则级过滤完成后，额外执行变体专属 ops 并渲染独立产物
#
# id 为全局唯一标识，供 rules[].outputs 及 Geo 自动发布引用。
# icon 可选（内置：mihomo、singbox、shadowrocket、surge），省略时按 id 自动推断。
clients:
  - id: mihomo
    name: Mihomo
    icon: mihomo
    formats:
      - id: mihomo-classical
        name: Classical
        template: mihomo-classical
      - id: mihomo-yaml
        name: YAML
        template: mihomo-yaml

  - id: sing-box
    name: sing-box
    icon: singbox
    formats:
      - id: singbox
        name: Source
        template: singbox
      - id: singbox-binary
        name: Binary
        template: singbox-binary

    # 派生变体：产物输出至 rules/<variant.id>/ 目录；多格式客户端下须显式指定 template。
    variants:
      - id: sing-box-non-ip
        name: Non-IP
        template: singbox
        ops:
          - type: exclude_kinds
            kinds: [ip_cidr]

# ============================================================
# rules —— 规则编译单元
# ============================================================
# 编译流水线：读取来源与预处理 -> 解析 -> 集合合并 -> 规则级过滤（ops） -> 模板渲染。
# 必填字段：id（全局唯一，不可含路径分隔符）、name、sources、outputs。
rules:
  - id: OpenAI
    name: OpenAI
    description: OpenAI 服务规则
    tags: [ai, service]

    # --- 数据源 sources ---
    # 支持六种来源类型及单层分组（group）；label 可选，用于日志与报错定位；格式自动识别。
    sources:
      # 1) 远程规则列表（URL）
      - label: blackmatrix7-openai
        type: url
        url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/OpenAI/OpenAI.list

      # 2) 内联规则文本
      # - label: inline-rules
      #   type: local
      #   content: |-
      #     DOMAIN,api.example.com
      #     DOMAIN-SUFFIX,example.net

      # 3) 本地规则文件（相对于 <data-dir>/local/ 的路径）
      # - label: local-file
      #   type: local
      #   file: custom.list

      # 4) 引用其他规则（按依赖拓扑顺序先行编译）
      # - label: shared-base
      #   type: ref
      #   ref: base_rules

      # 5) Geosite 域名列表：provider/list 或 provider/list@attr1,attr2
      #    可选 provider：v2fly、loyalsoldier
      # - label: geosite-list
      #   type: geosite
      #   geosite: v2fly/google@cn

      # 6) GeoIP 地址列表：provider/list（展开为 IPv4/IPv6 CIDR）
      #    可选 provider：loyalsoldier、v2fly
      # - label: geoip-list
      #   type: geoip
      #   geoip: loyalsoldier/cn

      # 来源分组：组内成员分别预处理与解析，合并（并集）后执行组级 ops。
      # 普通来源与 group 均可配置局部 preprocess 与 ops；
      # preprocess 省略时继承规则级脚本，设为 "" 时禁用预处理。
      # - group:
      #     - url: https://example.com/a.list
      #     - url: https://example.com/b.list
      #   preprocess: |-
      #     function process(content) { return content.trim(); }
      #   ops:
      #     - type: include_kinds
      #       kinds: [domain, domain_suffix]

    # --- 规则级过滤操作 ops（可选，按数组顺序执行）---
    # · include_kinds：仅保留指定类型
    # · exclude_kinds：移除指定类型
    # · filter_values：移除值匹配 pattern 的条目（mode: keyword / suffix / prefix / exact / regex）
    ops:
      - type: include_kinds
        kinds: [domain, domain_suffix, domain_keyword, ip_cidr]
      # - type: filter_values
      #   mode: suffix
      #   pattern: internal.example

    # --- 合并策略 merge（可选，默认 union）---
    # 可选值：union（并集）/ intersect（交集）/ difference（差集：首项减去其余项）
    merge:
      strategy: union

    # --- 目标客户端 outputs ---
    # 引用 clients[].id，自动展开该客户端下的全部 formats 与 variants。
    outputs: [mihomo, sing-box]

# ============================================================
# geosite 自动发布与原始库托管（可选）
# ============================================================
# 将指定 provider 的全量分类及属性变体批量编译至目标客户端：
#   产物路径：rules/<输出目标 ID>/geosite/<provider>/<list><ext>
#   host: true 时额外发布原始数据库至 geo/geosite/<provider>/
# geosite:
#   providers:
#     - name: v2fly             # v2fly 或 loyalsoldier
#       clients: [mihomo, sing-box]
#       # host: true

# ============================================================
# geoip 自动发布与原始库托管（可选）
# ============================================================
# 将指定 provider 的全量 IP 分类批量编译至目标客户端：
#   产物路径：rules/<输出目标 ID>/geoip/<provider>/<list><ext>
#   host: true 时额外发布原始数据库至 geo/geoip/<provider>/geoip.dat
# geoip:
#   providers:
#     - name: loyalsoldier      # loyalsoldier 或 v2fly
#       clients: [mihomo, sing-box]
#       # host: true
#     - name: v2fly
#       clients: [mihomo]

# ============================================================
# mmdb / asn 原始数据库托管（可选）
# ============================================================
# 在公开站 /geo/ 路径下托管 Country.mmdb 与 GeoLite2-ASN.mmdb（随 GeoIP 更新下载）。
# mmdb:
#   providers:
#     - name: loyalsoldier
#       host: true
# asn:
#   providers:
#     - name: loyalsoldier
#       host: true

# ============================================================
# update —— 历史保留、定时调度与资源限制
# ============================================================
update:
  history_retention: 168h      # 更新历史最长保留时间
  history_limit: 200           # 更新历史保留条数上限（1..10000）

  schedule:
    # 调度模式：manual（手动）/ interval（固定间隔）/ cron（定时表达式，仅在 prm serve 下生效）
    mode: manual
    # interval: 30m
    # cron: "0 3 * * *"
    timezone: UTC

  fetch:
    timeout: 15s               # 单次请求响应与传输停滞（stall）超时
    max_download: 50MB         # 单个远程资源体积上限
    concurrency: 4             # 全局最大并发下载数（1..64）
    per_host_concurrency: 2    # 单主机最大并发下载数（1..concurrency）
    retries: 2                 # 请求失败重试次数（0..10）
    retry_delay: 500ms         # 重试退避基础间隔
    user_agent: Proxy-Rule-Manager/2.0

  preprocess:
    timeout: 5s                # 单次 JavaScript 预处理超时时间
    max_output: 8MB            # 单次预处理输出体积上限
