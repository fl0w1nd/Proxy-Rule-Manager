# ============================================================
# Proxy Rule Manager 配置模板
# ============================================================
#
# 这份文件既是模板，也是完整参考。怎么用：
#
#   cp config.template.yaml config.yaml   # 复制为实际配置
#   prm validate -c config.yaml           # 检查配置是否合法（带行号报错）
#   prm update                            # 拉取来源并生成所有客户端产物
#
# 三条通用约定：
#   · ${ENV_NAME}               字符串里可以用环境变量插值，适合放令牌、私有地址
#   · 时长用 Go duration 语法：500ms、15s、30m、168h
#   · 大小可写 "4MB" 或纯数字字节数（4000000）
#   · 数据目录和 HTTP 参数通过 CLI flag 或 PRM_* 环境变量设置
#
# 每个字段都标注了可选值或默认值；完整的应用讲解见 docs/configuration.md。
# ============================================================

# ============================================================
# clients —— 你的代理客户端
# ============================================================
# 这里声明"规则最终渲染给谁、用什么格式"。三种写法：
#   · 多格式：formats 下列多个模板（如 Mihomo 的 Classical / YAML）
#   · 单格式：直接写 template
#   · 派生变体：variants，渲染前对规则再过滤一次
#
# id 是全文通用引用值（rules 的 outputs 里要用到），不能重复。
# name 用于站点页面展示；icon 可选，省略时按 id 推断。
clients:
  - id: mihomo
    name: Mihomo
    icon: mihomo
    formats:
      - id: mihomo-classical
        name: Classical
        template: mihomo-classical
      - id: mihomo-yaml
        name: YAML
        template: mihomo-yaml

  # 单格式客户端：一个 template 就够，产物目录名取客户端 id。
  - id: sing-box
    name: sing-box
    icon: singbox
    template: singbox

    # 变体：产物目录名取 id；template 省略时继承客户端的模板。
    # 常见用途：sing-box 出全量规则，另出一份不含 IP 段的。
    variants:
      - id: sing-box-non-ip
        name: Non-IP
        ops:
          - type: exclude_kinds
            kinds: [ip_cidr]

# ============================================================
# rules —— 一条规则 = 一次编译单元
# ============================================================
# 更新流程：读取各来源 -> 合并 -> 过滤（ops）-> 渲染各客户端产物。
# 一条规则最少需要：id、name、一个 sources、outputs。
#   · id 必须唯一，且不能包含路径分隔符；同时充当 ref 引用值和输出文件名
#   · name / description / tags 用于站点页面的展示与筛选
rules:
  - id: OpenAI
    name: OpenAI
    description: OpenAI 服务规则
    tags: [ai, service]

    # --- 来源 sources ---
    # 支持五种来源，每个来源只选一种写法；label 可选，用于日志和报错定位。
    sources:
      # 1) 远程规则列表（最常见）：直接给 URL。
      - label: blackmatrix7-openai
        type: url
        url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/OpenAI/OpenAI.list
        # format 可选：auto / classical / mihomo-yaml，省略时自动识别
        format: classical

      # 2) 内联文本：少量规则直接写在配置里。
      # - label: inline-rules
      #   type: local
      #   format: classical
      #   content: |-
      #     DOMAIN,api.example.com
      #     DOMAIN-SUFFIX,example.net

      # 3) 本地文件：相对路径以 data/local 为根，custom.list 指向 data/local/custom.list。
      # - label: local-file
      #   type: local
      #   file: custom.list

      # 4) 引用另一条规则：被引用的规则会先编译，在这里完整继承其内容。
      # - label: shared-base
      #   type: ref
      #   ref: base_rules

      # 5) geosite 列表：provider/list 或 provider/list@attr1,attr2。
      #    可用 provider：v2fly、loyalsoldier。
      # - label: geosite-list
      #   type: geosite
      #   geosite: v2fly/google@cn

    # --- 过滤 ops（可选，按声明顺序执行）---
    # include_kinds：只保留指定类型；exclude_kinds：移除指定类型。
    # 常用类型：domain、domain_suffix、domain_keyword、domain_regex、
    #           ip_cidr、ip_asn、geoip、process_name、user_agent 等。
    # filter_values：删除"值"匹配 pattern 的条目；
    #           mode 取 keyword（默认）/ suffix / prefix / exact / regex。
    ops:
      - type: include_kinds
        kinds: [domain, domain_suffix, domain_keyword, ip_cidr]
      # - type: filter_values
      #   mode: suffix
      #   pattern: internal.example

    # --- 多来源合并策略（可选，默认 union）---
    # union 并集（推荐）/ intersect 只留交集 / difference 用第一个来源减去其余来源
    merge:
      strategy: union

    # --- 输出 ---
    # 客户端 id 必须存在于上方的 clients；每个客户端会展开自己的全部格式和变体。
    outputs: [mihomo, sing-box]

# ------------------------------------------------------------
# geosite 自动发布（可选）
# ------------------------------------------------------------
# 把 provider 的全部列表与属性变体同步发布到目标客户端，
# 输出形如 rules/<客户端>/geosite/v2fly/google.list。
# 启用后无需为每个列表单独声明规则。
# geosite:
#   providers:
#     # provider 名称：v2fly 或 loyalsoldier，同一名称只声明一次
#     - name: v2fly
#       clients: [mihomo, sing-box]

# ============================================================
# update —— 更新历史、调度与资源限制
# ============================================================
update:
  # 更新历史：保留最近 168h 内、最多 200 条记录。
  history_retention: 168h
  history_limit: 200           # 1..10000

  schedule:
    # 自动更新模式：manual 手动 / interval 固定间隔 / cron 定时表达式。
    # 需要在 prm serve 运行中才会调度执行；manual 模式只在你执行 update 时运行。
    mode: manual
    # interval: 30m
    # cron: "0 3 * * *"         # 每天 03:00，时区见下
    timezone: UTC

  fetch:
    timeout: 15s               # 单次 HTTP 请求超时
    max_download: 4MB          # 单个远程来源的最大下载量
    concurrency: 4             # 全局并发下载数（1..64）
    per_host_concurrency: 2    # 同一主机的并发下载数（1..concurrency）
    retries: 2                 # 请求失败后的重试次数（0..10）
    retry_delay: 500ms         # 重试基础间隔
    user_agent: Proxy-Rule-Manager/2.0

  preprocess:
    timeout: 5s                # 单次 JavaScript 预处理的最长耗时
    max_output: 8MB            # 预处理结果的最大体积
